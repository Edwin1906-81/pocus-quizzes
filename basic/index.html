<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basic POCUS Quiz</title>
<style>
:root{
  --bg:#f6f5f2;--card:#ffffff;--ink:#1d1d1f;--muted:#5f6368;--line:#dedbd4;
  --accent:#8b1a1a;--accent-ink:#ffffff;--ok:#1e7a46;--ok-bg:#e6f4ec;--bad:#b3261e;--bad-bg:#fbe9e7;--chip:#f0ece6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141414;--card:#1f1f1f;--ink:#ececec;--muted:#a3a3a3;--line:#333;
    --accent:#d0585a;--accent-ink:#141414;--ok:#6fcf97;--ok-bg:#16301f;--bad:#f28b82;--bad-bg:#3a1b19;--chip:#2a2a2a;
  }
}
:root[data-theme="dark"]{
  --bg:#141414;--card:#1f1f1f;--ink:#ececec;--muted:#a3a3a3;--line:#333;
  --accent:#d0585a;--accent-ink:#141414;--ok:#6fcf97;--ok-bg:#16301f;--bad:#f28b82;--bad-bg:#3a1b19;--chip:#2a2a2a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px}
header h1{margin:0 0 4px;font-size:1.6rem;letter-spacing:-.01em}
header p{margin:0;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;margin:20px 0 8px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:16px}
.chip{display:inline-block;background:var(--chip);color:var(--muted);font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:3px 10px;border-radius:999px}
.stem{font-size:1.08rem;margin:12px 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt b{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.82rem}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.explain{margin-top:16px;padding:14px 16px;border-left:4px solid var(--accent);background:var(--chip);border-radius:0 10px 10px 0}
.explain h3{margin:0 0 6px;font-size:1rem}
.video{margin-top:14px}
.video .frame{position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video a{color:var(--accent);font-weight:600}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:default}
.score{font-size:2.6rem;font-weight:700;margin:6px 0}
.pass{color:var(--ok)} .fail{color:var(--bad)}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:.92rem}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.row-btn{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:0;text-align:left}
input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin:8px 0 14px}
@media print{.nav,.no-print{display:none}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Basic POCUS Quiz</h1>
    <p>Pulmonary POCUS · Resident Credentialing · 25 questions · 70% to pass</p>
  </header>
  <div id="app"></div>
</div>

<script>
/* ============================================================
   VIDEO LINKS: paste the YouTube URL already used on
   pulmonarypocus.com for each question. Any YouTube link format
   works (youtu.be/..., youtube.com/watch?v=..., /shorts/...).
   Leave "" to hide the video for that question.
   ============================================================ */
/* ============================================================
   RESULTS: paste your Google Apps Script web app URL (ends in /exec).
   Every finished attempt is sent to your Google Sheet.
   ============================================================ */
const RESULTS_URL = "https://script.google.com/macros/s/AKfycbwBhq_7ezHr4P37SCphQS22Y-XuJDwHvXYY7YdLbmcdNJzoHjRO68HicW5gk5GdC9W6/exec";
const QUIZ_NAME = "Basic POCUS Quiz";

const VIDEOS = {
  1:"https://youtu.be/E0KGrQ46NxM", 2:"", 3:"https://youtu.be/e_e7QpBJuI8", 4:"", 5:"",
  6:"https://youtu.be/e_e7QpBJuI8", 7:"", 8:"https://youtu.be/u3LfD1-S7LQ", 9:"", 10:"",
  11:"", 12:"", 13:"", 14:"", 15:"https://youtu.be/rLmnmxAhEEU",
  16:"", 17:"", 18:"", 19:"", 20:"https://youtu.be/_r0beUxvzXY",
  21:"https://youtu.be/qCh1POo5WTA", 22:"https://youtu.be/Hvhezxl5_L0", 23:"https://youtu.be/4cvWrMCoEyI", 24:"", 25:"https://youtu.be/Yq31rO82Ad8"
};

const Q = [
{id:1,topic:"Knobology",stem:"What type of transducer is being used here?",
 opts:["Phased array with the abdominal preset","Phased array with the cardiac preset","Curvilinear with the abdominal preset","Linear with the lung preset"],a:0,
 ex:"The image fans out from a narrow point at the top of the screen, which is the signature of a phased array probe. A curvilinear probe makes a wide, curved top edge, and a linear probe makes a rectangular image. The orientation marker is on the left of the screen, which is the abdominal (radiology) convention; the cardiac preset flips the marker to the right."},
{id:2,topic:"Physics",stem:"Increasing transducer frequency has which effect?",
 opts:["Better resolution and deeper penetration","Better resolution and less penetration","Worse resolution and deeper penetration","No change in resolution, less penetration"],a:1,
 ex:"Higher frequency means shorter wavelength, so axial resolution improves. It is also attenuated faster, so penetration drops. This is why linear probes are used for superficial structures and low frequency phased array or curvilinear probes for the heart and abdomen."},
{id:3,topic:"Lung",stem:"What artifact is seen in the left and right lung?",
 opts:["A-lines on the left, B-lines on the right","B-lines on the left, A-lines on the right","A-lines in both lungs","B-lines in both lungs"],a:0,
 ex:"The left lung shows A-lines: horizontal reverberations of the pleural line repeating at equal intervals, which with lung sliding indicate normally aerated lung. The right lung shows B-lines: vertical hyperechoic artifacts that start at the pleural line, reach the bottom of the screen without fading, move with sliding and erase the A-lines."},
{id:4,topic:"Lung",stem:"M-mode through the pleural line shows only horizontal lines above and below the pleura (the barcode or stratosphere sign). What does this mean?",
 opts:["Normal lung sliding","Absent lung sliding at that location","Consolidation","Diaphragmatic paralysis"],a:1,
 ex:"Normal sliding produces the seashore sign: flat lines above the pleura and a granular pattern below. The barcode sign means no sliding at that spot. Pneumothorax is one cause, but so are mainstem intubation, apnea, pleurodesis and adhesions. It supports pneumothorax but does not prove it."},
{id:5,topic:"Lung",stem:"Which finding is essentially diagnostic (most specific) for pneumothorax?",
 opts:["Absent lung sliding","Absent B-lines","Lung point","Lung pulse"],a:2,
 ex:"The lung point is where sliding lung meets non-sliding pleura during the respiratory cycle, marking the edge of the pneumothorax. It is close to 100% specific. Absent sliding and absent B-lines are sensitive but not specific. A lung pulse means the pleurae are apposed, which argues against pneumothorax at that spot."},
{id:6,topic:"Lung",stem:"Which description fits a B-line?",
 opts:["Horizontal line repeating the pleural line at equal intervals","Short vertical line that fades within 2 cm","Vertical hyperechoic artifact from the pleural line to the bottom of the screen that moves with sliding and erases A-lines","Hypoechoic space above the diaphragm"],a:2,
 ex:"The right-sided image of the right lung shows B-lines. B-lines arise from the pleural line, extend to the bottom of the screen without fading, move with lung sliding and erase A-lines. Three or more in one intercostal space is a positive zone. Bilateral, diffuse positive zones suggest an interstitial syndrome such as cardiogenic pulmonary edema."},
{id:7,topic:"Lung",stem:"In the right coronal view you can see the vertebral bodies continue above the diaphragm. What does this suggest?",
 opts:["Normal aerated lung","Pleural effusion (spine sign)","Pneumothorax","Ascites only"],a:1,
 ex:"Air normally scatters the beam above the diaphragm so the spine stops at the diaphragm. Fluid transmits sound, so the spine becomes visible above it. This spine sign is a reliable marker of pleural effusion, often with the curtain sign lost."},
{id:8,topic:"Lung",stem:"A tissue-like (hepatized) area of lung contains bright branching echoes that move toward the periphery with each breath. This favors:",
 opts:["Obstructive atelectasis","Pneumonia (dynamic air bronchograms)","Pneumothorax","Pulmonary embolism"],a:1,
 ex:"Dynamic air bronchograms show air moving within patent bronchi inside consolidated lung. That pattern favors pneumonia. Static air bronchograms are less specific and are seen in resorptive atelectasis."},
{id:9,topic:"Cardiac",stem:"In the parasternal long axis view, an anechoic fluid collection lies between the posterior LV wall and the descending thoracic aorta, tapering anterior to the aorta. This is most likely:",
 opts:["Left pleural effusion","Pericardial effusion","Ascites","Epicardial fat pad"],a:1,
 ex:"The descending aorta is the landmark. Pericardial fluid tracks anterior to the descending aorta. Left pleural fluid lies posterior to it. An anterior echo-free space alone is often epicardial fat."},
{id:10,topic:"Cardiac",stem:"A patient with a large pericardial effusion is hypotensive. Which echo finding is the most specific for tamponade physiology?",
 opts:["Plethoric IVC","Diastolic collapse of the RV free wall","Swinging heart","Effusion over 2 cm"],a:1,
 ex:"RV diastolic collapse is the most specific chamber finding. RA systolic collapse lasting more than a third of the cardiac cycle is also supportive. A plethoric IVC is very sensitive but not specific. Size alone does not define tamponade; rate of accumulation matters."},
{id:11,topic:"Cardiac",stem:"In the apical 4-chamber view, which finding suggests RV dilation?",
 opts:["RV smaller than two thirds of the LV","RV to LV basal diameter ratio greater than 1","Apex formed by the RV only when the LV is hyperdynamic","LA larger than RA"],a:1,
 ex:"Normally the RV is about two thirds the size of the LV and the LV forms the apex. An RV to LV ratio greater than 1, or an RV that takes over the apex, indicates RV dilation, as seen in acute PE or chronic pulmonary hypertension."},
{id:12,topic:"Cardiac",stem:"RV free wall akinesis with preserved motion of the RV apex is known as:",
 opts:["D sign","McConnell sign","Sail sign","Mercedes sign"],a:1,
 ex:"McConnell sign is RV free wall hypokinesis with apical sparing. It is associated with acute pulmonary embolism, but it is not specific and can be seen with RV infarction."},
{id:13,topic:"Cardiac",stem:"On M-mode through the anterior mitral leaflet in PLAX, the E-point septal separation (EPSS) is 14 mm. This suggests:",
 opts:["Normal LV systolic function","Reduced LV systolic function","Mitral stenosis","Hypovolemia"],a:1,
 ex:"EPSS above about 7 mm correlates with reduced LVEF. It is quick and reproducible, but it is unreliable with mitral stenosis, severe AR (the jet pushes the leaflet) and asymmetric septal hypertrophy."},
{id:14,topic:"Cardiac",stem:"In the parasternal short axis view the septum is flattened (D sign). Which pattern indicates combined RV pressure and volume overload?",
 opts:["Flattening only in end diastole","Flattening only in end systole","Flattening throughout both systole and diastole","A round LV in both systole and diastole"],a:2,
 ex:"Timing tells you the mechanism. Septal flattening mainly in end systole points to RV pressure overload, as in pulmonary hypertension or acute PE. Flattening mainly in end diastole points to RV volume overload, as in severe TR or an ASD. Flattening that persists through the whole cardiac cycle means both pressure and volume overload, which is common in advanced pulmonary hypertension. A normal LV stays round in both phases."},
{id:15,topic:"IVC",stem:"A spontaneously breathing patient has an IVC of 1.6 cm that collapses more than 50% with a sniff. The estimated RA pressure is:",
 opts:["About 3 mmHg (0 to 5)","About 8 mmHg (5 to 10)","About 15 mmHg","Cannot be estimated"],a:0,
 ex:"By ASE guidance, an IVC of 2.1 cm or less that collapses more than 50% suggests a normal RA pressure of about 3 mmHg. A dilated IVC that collapses less than 50% suggests about 15 mmHg. Mixed patterns fall in between at about 8 mmHg."},
{id:16,topic:"IVC",stem:"Which statement about IVC assessment in a patient on positive pressure ventilation is correct?",
 opts:["Collapsibility cutoffs from spontaneous breathing apply directly","The IVC usually gets smaller during inspiration on the ventilator","A small IVC still suggests low RA pressure, but a large IVC is hard to interpret","IVC size cannot be measured in ventilated patients"],a:2,
 ex:"Positive pressure raises intrathoracic pressure and tends to distend the IVC during inspiration, so spontaneous breathing collapsibility cutoffs do not apply. A plump IVC is common on the ventilator and is nonspecific, while a small IVC still suggests low RA pressure."},
{id:17,topic:"Vascular",stem:"During a 2-region compression exam, the common femoral vein does not fully collapse with firm pressure that does compress the artery wall. This means:",
 opts:["Normal vein","Deep vein thrombosis until proven otherwise","Arterial occlusion","Too much gel"],a:1,
 ex:"Full apposition of the venous walls with compression rules out DVT at that site. Incomplete compression is the key diagnostic finding, even when the clot is not visible because acute thrombus can be anechoic. Check the common femoral vein near the saphenous junction and the popliteal vein."},
{id:18,topic:"Abdominal",stem:"In a supine patient, where does free intraperitoneal fluid collect first on a FAST exam?",
 opts:["Splenorenal recess","Hepatorenal space (Morison pouch), especially at the inferior liver tip","Pelvis, behind the bladder","Subxiphoid space"],a:1,
 ex:"The hepatorenal space is the most dependent upper abdominal space in the supine patient. The caudal tip of the liver near the right paracolic gutter is the most sensitive single spot, so always sweep it into view."},
{id:19,topic:"Renal",stem:"A renal scan shows anechoic, branching, connected spaces within the renal sinus that have no color flow. This is most consistent with:",
 opts:["Renal cysts","Hydronephrosis","Renal vein thrombosis","Normal renal pyramids"],a:1,
 ex:"A dilated collecting system appears as connected anechoic spaces in the renal sinus. Color Doppler helps confirm there is no flow, separating it from prominent renal vessels. Cysts are round and separate, and pyramids are hypoechoic but sit in the cortex in a regular pattern."},
{id:20,topic:"VExUS",stem:"Hepatic vein Doppler shows both S and D waves below the baseline, but S is smaller than D. The IVC measures 2.4 cm. How is the hepatic vein waveform graded?",
 opts:["Normal","Mildly abnormal","Severely abnormal","Cannot be graded"],a:1,
 ex:"Normal hepatic vein flow has S larger than D, both antegrade. S smaller than D is mildly abnormal. S reversal is severely abnormal. Watch for atrial fibrillation, which can blunt S without high RA pressure. With an IVC over 2 cm, VExUS grading proceeds to the hepatic, portal and intrarenal veins."},
{id:21,topic:"Doppler",stem:"Using a standard color map, flow moving toward the transducer is displayed as:",
 opts:["Blue","Red","Green","Yellow only when aliasing"],a:1,
 ex:"Remember BART: Blue Away, Red Toward. Color shows direction relative to the transducer, not whether the vessel is an artery or vein. The same vessel can turn red or blue just by changing the probe angle."},
{id:22,topic:"Doppler",stem:"You place a spectral Doppler beam at about 90 degrees to the direction of blood flow. What happens to the measured velocity?",
 opts:["It is most accurate","It is overestimated","Little or no Doppler shift is detected","It aliases"],a:2,
 ex:"Measured velocity depends on the cosine of the insonation angle. At 0 degrees (beam parallel to flow) the measurement is accurate. As the angle increases, velocity is underestimated, and at 90 degrees cosine is zero, so almost no shift is detected. For cardiac Doppler, keep the beam within about 20 degrees of flow."},
{id:23,topic:"Doppler",stem:"You want the peak velocity of a tricuspid regurgitation jet to estimate RV systolic pressure. Which Doppler mode should you use?",
 opts:["Pulsed wave Doppler","Continuous wave Doppler","Color Doppler","Tissue Doppler"],a:1,
 ex:"TR jets are fast, often 2.5 to 4 m/s or higher. Pulsed wave Doppler samples one depth but aliases at high velocities. Continuous wave Doppler measures high velocities accurately, at the cost of not knowing exactly where along the beam the peak occurred. Use color first to line the CW cursor up with the jet."},
{id:24,topic:"Doppler",stem:"The TR peak velocity is 3.5 m/s and estimated RA pressure is 8 mmHg. What is the estimated RV systolic pressure?",
 opts:["About 22 mmHg","About 36 mmHg","About 57 mmHg","About 71 mmHg"],a:2,
 ex:"Use the simplified Bernoulli equation: gradient = 4 x V squared = 4 x 3.5 x 3.5 = 49 mmHg. Add RA pressure: 49 + 8 = 57 mmHg. Without pulmonic stenosis, RVSP approximates PA systolic pressure. A poorly aligned or incomplete TR envelope will underestimate it."},
{id:25,topic:"Doppler",stem:"Pulsed wave Doppler in the LVOT (apical 5-chamber view, sample volume just below the aortic valve) gives a VTI of 11 cm. This most suggests:",
 opts:["Normal stroke volume","Low stroke volume","Severe aortic stenosis","Hyperdynamic circulation"],a:1,
 ex:"Normal LVOT VTI is about 18 to 22 cm. A VTI under about 15 cm suggests low stroke volume. VTI x LVOT area = stroke volume, and stroke volume x heart rate = cardiac output. Because LVOT area is fixed in a given patient, serial VTI is a practical way to track response to fluids or inotropes."}
];

/* Shuffle answer order each time the quiz loads */
Q.forEach(q=>{
  const idx=q.opts.map((_,k)=>k);
  for(let k=idx.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[idx[k],idx[j]]=[idx[j],idx[k]];}
  q.opts=idx.map(k=>q.opts[k]); q.a=idx.indexOf(q.a);
});

const PASS = 0.70;
let state = {i:0, ans:Array(Q.length).fill(null), name:"", view:"start", sent:false};

function ytEmbed(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|v=|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/);
  return m ? "https://www.youtube-nocookie.com/embed/"+m[1] : null;
}
const L = "ABCDEFG";
const el = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  if(state.view==="start") return renderStart();
  if(state.view==="done") return renderDone();
  renderQ();
}

function renderStart(){
  el.innerHTML = `
  <div class="card">
    <p style="margin-top:0">This quiz covers the basic POCUS applications in the resident credentialing pathway: knobology, lung, cardiac, IVC, vascular, abdominal, renal, VExUS, and color and spectral Doppler. Each answer shows an explanation and, where available, a teaching video from the site.</p>
    <label for="nm"><b>Your name</b> (shown on your results)</label>
    <input id="nm" type="text" placeholder="First and last name" autocomplete="name" value="${esc(state.name)}">
    <button class="btn" id="go">Start quiz</button>
  </div>`;
  const nm=document.getElementById("nm"), go=document.getElementById("go");
  const chk=()=>{go.disabled=nm.value.trim().length<3;}; chk(); nm.oninput=chk;
  go.onclick=()=>{state.name=nm.value.trim();state.view="q";render();};
}

function renderQ(){
  const q=Q[state.i], picked=state.ans[state.i], answered=picked!==null;
  const done=state.ans.filter(a=>a!==null).length;
  let opts=q.opts.map((o,k)=>{
    let cls="opt";
    if(answered){ if(k===q.a) cls+=" correct"; else if(k===picked) cls+=" wrong"; }
    return `<button class="${cls}" data-k="${k}" ${answered?"disabled":""}><b>${L[k]}</b><span>${esc(o)}</span></button>`;
  }).join("");
  let ex="";
  if(answered){
    const ok=picked===q.a, src=ytEmbed(VIDEOS[q.id]);
    ex=`<div class="explain"><h3 class="${ok?"pass":"fail"}">${ok?"Correct":"Incorrect"}. Answer: ${L[q.a]}</h3><div>${esc(q.ex)}</div>
      ${src?`<div class="video"><div class="frame"><iframe src="${src}" title="Teaching video" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
      <div style="margin-top:6px"><a href="${esc(VIDEOS[q.id])}" target="_blank" rel="noopener">Open video on YouTube</a></div></div>`:""}</div>`;
  }
  const last=state.i===Q.length-1;
  el.innerHTML=`
  <div class="bar"><span style="width:${done/Q.length*100}%"></span></div>
  <div class="meta"><span>Question ${state.i+1} of ${Q.length}</span><span>${done} answered</span></div>
  <div class="card">
    <span class="chip">${q.topic}</span>
    <div class="stem">${esc(q.stem)}</div>
    ${opts}${ex}
    <div class="nav">
      <button class="btn ghost" id="prev" ${state.i===0?"disabled":""}>Back</button>
      <button class="btn" id="next" ${answered?"":"disabled"}>${last?"See results":"Next"}</button>
    </div>
  </div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{state.ans[state.i]=+b.dataset.k;render();});
  document.getElementById("prev").onclick=()=>{state.i--;render();};
  document.getElementById("next").onclick=()=>{
    if(last){ state.view="done"; } else state.i++;
    render(); window.scrollTo(0,0);
  };
}

function renderDone(){
  const correct=Q.filter((q,k)=>state.ans[k]===q.a).length, pct=correct/Q.length, pass=pct>=PASS;
  const topics={};
  Q.forEach((q,k)=>{topics[q.topic]=topics[q.topic]||[0,0];topics[q.topic][1]++;if(state.ans[k]===q.a)topics[q.topic][0]++;});
  const rows=Q.map((q,k)=>{const ok=state.ans[k]===q.a;return `<tr><td><span class="dot" style="background:var(--${ok?"ok":"bad"})"></span></td><td><button class="row-btn" data-k="${k}">${k+1}. ${esc(q.stem.slice(0,90))}${q.stem.length>90?"...":""}</button></td><td>${q.topic}</td></tr>`;}).join("");
  const trows=Object.entries(topics).map(([t,[c,n]])=>`<tr><td>${t}</td><td>${c} / ${n}</td></tr>`).join("");
  el.innerHTML=`
  <div class="card">
    <div class="chip">${state.name?esc(state.name)+" · ":""}${new Date().toLocaleDateString()}</div>
    <div class="score ${pass?"pass":"fail"}">${correct} / ${Q.length} (${Math.round(pct*100)}%)</div>
    <p style="margin:0"><b>${pass?"Passed.":"Not yet passed."}</b> ${pass?"Nice work. Screenshot or print this page for your credentialing file.":"A score of 70% ("+Math.ceil(PASS*Q.length)+" of "+Q.length+") is needed. Review the missed questions and their videos, then try again."}</p>
    <p id="sendStatus" class="no-print" style="color:var(--muted);font-size:.9rem;margin:10px 0 0"></p>
    <table><tr><th>Topic</th><th>Score</th></tr>${trows}</table>
    <table><tr><th></th><th>Question (tap to review)</th><th>Topic</th></tr>${rows}</table>
    <div class="nav no-print">
      <button class="btn ghost" id="print">Print results</button>
      <button class="btn" id="retake">Retake</button>
    </div>
  </div>`;
  el.querySelectorAll(".row-btn").forEach(b=>b.onclick=()=>{state.i=+b.dataset.k;state.view="q";render();window.scrollTo(0,0);});
  document.getElementById("print").onclick=()=>window.print();
  if(!state.sent){
    state.sent=true;
    const missed=Q.map((q,k)=>state.ans[k]===q.a?null:(q.id+" ("+q.topic+")")).filter(Boolean).join(", ");
    sendResults({quiz:QUIZ_NAME,name:state.name,correct,total:Q.length,percent:Math.round(pct*100),
      result:pass?"Pass":"Fail",missed:missed||"None",
      topics:Object.entries(topics).map(([t,[c,n]])=>t+" "+c+"/"+n).join("; ")});
  } else setStatus(state.status||"");
  document.getElementById("retake").onclick=()=>{state={i:0,ans:Array(Q.length).fill(null),name:state.name,view:"q",sent:false};render();};
}

function setStatus(t){state.status=t;const e=document.getElementById("sendStatus");if(e)e.textContent=t;}
function sendResults(payload){
  if(!RESULTS_URL){setStatus("");return;}
  setStatus("Submitting your score...");
  fetch(RESULTS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)})
    .then(()=>setStatus("Score submitted to Dr. Jackson."))
    .catch(()=>setStatus("Could not submit your score. Please print this page and email it to pulmonarypocus@gmail.com."));
}

render();
</script>
